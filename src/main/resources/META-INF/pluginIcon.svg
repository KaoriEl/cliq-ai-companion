<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs>
        <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2BD46A" />
            <stop offset="100%" stop-color="#01B43C" />
        </linearGradient>
    </defs>
    <!-- Фон: темный круг, идеально центрирован -->
    <circle cx="32" cy="32" r="30" fill="#2B2D30"/>

    <!-- Центральный элемент: пересчитан для центрирования по осям -->
    <g>
        <!-- Основная дуга (символ Cliq/Companion) -->
        <path d="M44 20a16 16 0 1 0 0 24"
              fill="none"
              stroke="url(#grad5)"
              stroke-width="7"
              stroke-linecap="round"/>
        <!-- Световой акцент/блик сверху -->
        <path d="M44 20a16 16 0 0 0-6-3.5"
              fill="none"
              stroke="#FFFFFF"
              stroke-width="7"
              stroke-linecap="round" 
              opacity="0.8"/>
    </g>
</svg>
